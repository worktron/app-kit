<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kit fixture</title>
    <link rel="icon" href="data:," />
    <style>html, body { background: #f4efe6; margin: 0; }</style>
    <!-- The app's name before its code loads, in two pictures (README, "The first frame and the fonts"): signed out, where
         a home page would draw its title; for a browser signed in last time, which firstPaint marks, where the signed-in
         bar draws it (BAR_NAME in app.tsx, its React twin). -->
    <style>
      html:not([data-signed-in-before]) #root:empty::before { content: 'fixture'; display: block; padding-top: 30vh; text-align: center; font: 600 32px/40px sans-serif; }
      html[data-signed-in-before] #root:empty::before { content: 'fixture'; display: block; padding: 12px 16px; font: 600 16px/20px sans-serif; }
    </style>
  </head>
  <!-- No body tags, on purpose: the root's own tag makes the body, in the same step as the root, so the browser has no
       body to paint before the name (README, "The name before the code, in one picture or two"). -->
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</html>
