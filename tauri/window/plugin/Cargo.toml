# app-kit's window onto an app's hosted site, for a Tauri app's Mac, Windows and iPhone shell: desktop sign-in's shell half,
# links out, close hides, and the rest README.md's "A window onto the hosted site" lists. An app's shell builds it from
# the kit bun installed, by a Cargo path into node_modules.
[package]
name = "tauri-plugin-app-kit-window"
version = "0.1.0"
description = "A Tauri window onto an app's hosted site, with desktop sign-in's shell half"
edition = "2021"
rust-version = "1.77.2"
publish = false
# Tauri's name for the plugin's permissions (`app-kit-window:allow-…`), which an app's build reads through it.
links = "tauri-plugin-app-kit-window"

[dependencies]
# 2.12.5 restarts a Mac app through macOS (LaunchServices), which src/relaunch.rs does too, waiting for the old copy
# to quit first; Tauri's restart is its fallback.
tauri = "2.12.5"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
# The Mac app's updates from its releases (updates.rs), turned on by plugins.updater in the app's tauri.conf.json.
tauri-plugin-updater = "2.14"
# Opening the app at login through macOS's own login items (login_item.rs), for the Settings window's switch.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
# The menu check a Mac release runs on a worker Mac (src/menu_check.rs) walks and chooses the app's own menu bar.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows hands desktop sign-in's link to a second copy of the app, which passes it to the running one and quits through
# the single-instance plugin, whose deep-link feature hands it on to the deep-link plugin (windows.rs).
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Reads the window's minimum size back from the window, which Tauri cannot (src/fit.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Turns on the iPhone web view's swipe back and turns off shake to undo (src/iphone.rs), which Tauri has no setting for.
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
# Keeps the page between Android's status bar and navigation bar (src/android.rs), through the web view Tauri hands over.
jni = "0.21"

[dev-dependencies]
base64 = "0.23"
minisign = "0.10.0"
# The Settings window's permission test reads the permission files build.rs writes, as an app's build does.
toml = "0.9"
tauri = { version = "2.12.5", features = ["test"] }
# The README's shell registers these, and tests/readme.rs compiles it.
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
# windows.rs, which the tests run on the Mac too.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# tests/menu.rs builds the menu bar on the main thread, which macOS requires, and reads back what macOS holds.
[[test]]
name = "menu"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication"] }
