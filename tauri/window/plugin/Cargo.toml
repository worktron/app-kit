# app-kit's window onto an app's hosted site, for a Tauri app's Mac and iPhone shell: desktop sign-in's shell half,
# links out, close hides, and the rest README.md's "A window onto the hosted site" lists. An app's shell builds it from
# the kit bun installed, by a Cargo path into node_modules.
[package]
name = "tauri-plugin-app-kit-window"
version = "0.1.0"
description = "A Tauri window onto an app's hosted site, with desktop sign-in's shell half"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
# 2.12.5 restarts a Mac app through macOS (LaunchServices), so it comes back in front as itself.
tauri = "2.12.5"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
# The Mac app's updates from its releases (updates.rs), turned on by plugins.updater in the app's tauri.conf.json.
tauri-plugin-updater = "2.14"

[dev-dependencies]
base64 = "0.23"
minisign = "0.10.0"
tauri = { version = "2.12.5", features = ["test"] }
# The README's shell registers these, and tests/readme.rs compiles it.
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"

# tests/menu.rs builds the menu bar on the main thread, which macOS requires, and reads back what macOS holds.
[[test]]
name = "menu"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication"] }
