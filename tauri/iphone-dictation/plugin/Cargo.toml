# app-kit's dictation with punctuation through Apple's speech recognizer, for a Tauri app's iPhone shell. An app's shell
# builds it from the kit bun installed, by a Cargo path into node_modules. iPhone only: anywhere else each command
# answers that it is not there.
[package]
name = "tauri-plugin-iphone-dictation"
version = "0.1.0"
description = "Dictation with punctuation through Apple's speech recognizer for app-kit's Tauri iPhone apps"
edition = "2021"
rust-version = "1.77.2"
publish = false
links = "tauri-plugin-iphone-dictation"

[dependencies]
tauri = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[package.metadata.tauri-plugin]
ios-src = "ios"
