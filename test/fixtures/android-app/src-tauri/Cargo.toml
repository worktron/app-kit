# The Android app scripts/android-e2e.ts builds: README.md's shell on the kit's window plugin, built from this checkout.
[package]
name = "android_fixture"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "android_fixture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-app-kit-window = { path = "../../../../tauri/window/plugin" }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde_json = "1"
